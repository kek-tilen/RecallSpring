[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recallspring-api"
version = "0.1.0"
description = "RecallSpring backend: durable learning records, deterministic review scheduling, pluggable AI providers"
requires-python = ">=3.12"
# Runtime dependencies are pinned with hashes in requirements.lock (source: requirements.in).
dependencies = []

[project.scripts]
recallspring = "recallspring_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # autogenerated, reviewed by hand

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
